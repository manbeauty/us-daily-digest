# 🇺🇸 美国每日资讯日报 - GitHub Actions 工作流
# 每天早上 9:00 (北京时间 = UTC 1:00) 自动运行
# 生成 HTML 日报并部署到 GitHub Pages

name: 🇺🇸 每日资讯日报

on:
  schedule:
    # 每天 UTC 1:00 = 北京时间 9:00
    - cron: '0 1 * * *'
  # 支持手动触发（方便测试）
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时间只运行一个部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "无外部依赖"

      - name: 📡 运行日报生成器
        run: python src/main.py

      - name: 📤 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传生成的 output 目录
          path: './output'

      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
